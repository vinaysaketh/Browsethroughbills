
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ElectricityBillExtractor electricity_bill_extractor.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ElectricityBillExtractor-Windows
          path: dist/ElectricityBillExtractor.exe
          if-no-files-found: error
          retention-days: 30
